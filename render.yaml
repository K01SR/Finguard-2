# ==============================================================================
# FinGuard — Render Deployment Blueprint
# Deploys unified all-in-one Docker container (FastAPI + React SPA + ML Models)
# 100% Free-Tier Compatible Single Web Service
# ==============================================================================
services:
  - type: web
    name: finguard
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DUCKDNS_DOMAIN
        value: finguarddd
      - key: DUCKDNS_TOKEN
        sync: false
